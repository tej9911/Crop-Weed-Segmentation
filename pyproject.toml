[project]
name = "crop-weed-mt-ahnet"
version = "2.0.0"
description = "Crop / weed patch classification with the MT-AHNet attention network, served through a Flask web app."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
